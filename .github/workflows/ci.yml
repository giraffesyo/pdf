name: CI

on:
  push:
    branches: [canary]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      - name: go mod tidy check
        if: runner.os != 'Windows'
        run: go mod tidy -diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: fuzz Extract 60s
        run: go test -run '^$' -fuzz '^FuzzExtract$' -fuzztime 60s .
      - name: fuzz Reader 60s
        run: go test -run '^$' -fuzz '^FuzzReader$' -fuzztime 60s ./internal/object

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: comparison matrix
        working-directory: benchmarks
        run: go test -run TestCompetitorComparison -v ./...
      - name: benchmarks
        if: github.event_name != 'pull_request'
        working-directory: benchmarks
        run: go test -bench . -benchmem -run '^$' ./...
      - name: check out pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
      - name: benchmark base
        if: github.event_name == 'pull_request'
        working-directory: benchmark-base/benchmarks
        run: go test -bench '^BenchmarkExtract$/^giraffesyo$' -benchmem -run '^$' -count=1 ./... | tee "$GITHUB_WORKSPACE/base-bench.txt"
      - name: record base benchmark
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.1
        with:
          name: PDF extraction
          tool: go
          output-file-path: base-bench.txt
          external-data-json-path: ${{ runner.temp }}/benchmark-data.json
          skip-fetch-gh-pages: true
      - name: benchmark pull request
        if: github.event_name == 'pull_request'
        working-directory: benchmarks
        run: go test -bench '^BenchmarkExtract$/^giraffesyo$' -benchmem -run '^$' -count=1 ./... | tee "$GITHUB_WORKSPACE/head-bench.txt"
      - name: check for benchmark regressions
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.1
        with:
          name: PDF extraction
          tool: go
          output-file-path: head-bench.txt
          external-data-json-path: ${{ runner.temp }}/benchmark-data.json
          save-data-file: false
          # Hosted runners commonly vary by 10–20%; alert above that range
          # and fail only when the same-run result regresses by at least 25%.
          alert-threshold: "120%"
          fail-threshold: "125%"
          fail-on-alert: true
          summary-always: true
          skip-fetch-gh-pages: true
