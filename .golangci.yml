version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

formatters:
  enable:
    - gofmt
    - goimports
